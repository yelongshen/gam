# G1 Deploy - Observation Configuration (sonic_pretrained, model_step_150000)
# ===========================================================================
# Exported from sonic_pretrained/model_step_150000.pt via
#   python gear_sonic/eval_agent_trl.py +checkpoint=<ckpt> +export_onnx_only=true
#
# Encoder input dimension: 1751   Decoder/policy dimension: 994   token: 64
# 10-frame lookahead model (smpl step1, g1 step5) - same registry entries as
# policy/release, EXCEPT the two command_z observations are omitted because
# this checkpoint's encoders do not consume them.

observations:

  - name: "token_state"
    enabled: true

  - name: "his_base_angular_velocity_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_positions_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_velocities_10frame_step1"
    enabled: true
    
  - name: "his_last_actions_10frame_step1"
    enabled: true

  - name: "his_gravity_dir_10frame_step1"
    enabled: true

encoder:
  dimension: 64
  use_fp16: false
  encoder_observations:
    - name: "encoder_mode_4"
      enabled: true
    - name: "motion_joint_positions_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_10frame_step5"
      enabled: true
    # NOTE: motion_root_z_position_10frame_step5 (10) and motion_root_z_position (1)
    # are present in policy/release but are NOT consumed by this checkpoint's
    # encoders (command_z* is absent from every encoder_input_features list),
    # so the exported encoder expects 1751 dims instead of 1762.
    - name: "motion_anchor_orientation"
      enabled: true
    - name: "motion_anchor_orientation_10frame_step5"
      enabled: true
    - name: "motion_joint_positions_lowerbody_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_lowerbody_10frame_step5"
      enabled: true
    - name: "vr_3point_local_target"
      enabled: true
    - name: "vr_3point_local_orn_target"
      enabled: true
    - name: "smpl_joints_10frame_step1"
      enabled: true
    - name: "smpl_anchor_orientation_10frame_step1" 
      enabled: true
    - name: "motion_joint_positions_wrists_10frame_step1" 
      enabled: true
  encoder_modes:
    - name: "g1"
      mode_id: 0
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_10frame_step5
        - motion_joint_velocities_10frame_step5
        - motion_anchor_orientation_10frame_step5
    - name: "teleop"
      mode_id: 1
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_lowerbody_10frame_step5
        - motion_joint_velocities_lowerbody_10frame_step5
        - vr_3point_local_target
        - vr_3point_local_orn_target
        - motion_anchor_orientation
    - name: "smpl"
      mode_id: 2
      required_observations:
        - encoder_mode_4
        - smpl_joints_10frame_step1
        - smpl_anchor_orientation_10frame_step1
        - motion_joint_positions_wrists_10frame_step1
