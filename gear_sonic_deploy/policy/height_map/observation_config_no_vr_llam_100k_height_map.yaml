# sonic_no_vr_llam_100k + pelvis height map (zero-weight) - Observation Configuration
# ===================================================================================
# The team's sonic_no_vr_llam_100k policy with the height-map observations wired in but not used:
#   Decoder: scripts/widen_decoder_for_height_map.py policy/sonic_no_vr_llam_100k/model_decoder.onnx ...
#            (input 994 -> 1478, zero weights on the new inputs; same actions as the original, checked)
#   Encoder: policy/sonic_no_vr_llam_100k/model_encoder.onnx, unchanged
# For bring-up of the height-map path with motors (terrain input, observation layout, timing) using
# a policy whose behaviour is known. The rest of this file is that policy's observation_config.yaml.

# G1 Deploy - Observation Configuration (REUBEN sonic_no_vr_low_latency_with_amass_envs_16K, model_step_080000)
# ================================================================================================================
# Exported from sonic_no_vr_low_latency_with_amass_envs_16K/model_step_080000.pt via
#   python gear_sonic/eval_agent_trl.py checkpoint=<ckpt> +num_envs=1 +export_onnx_only=true \
#     +manager_env.commands.motion.motion_lib_cfg.motion_file=<any local robot dir> \
#     +manager_env.commands.motion.motion_lib_cfg.smpl_motion_file=<any local smpl dir>
#   (the motion_file overrides are only needed because the checkpoint's baked-in
#    training paths point at the cluster and no longer exist locally)
#
# Encoder input dimension: 979   Decoder/policy dimension: 994   token: 64
#
# LOW-LATENCY + no-teleop + AMASS-augmented-training-corpus model. Architecturally
# IDENTICAL observation layout to policy/sonic_no_vr_ll_062k (same low-latency g1/smpl
# lookahead config below) -- the only difference from that checkpoint is the training
# data mix (AMASS clips added to the corpus) and step count (080k vs 062k), not the
# encoder/decoder shapes:
#   1. g1 lookahead is step1, not step5   (dt_future_ref_frames 0.02 @ 50fps = 1 frame)
#   2. smpl lookahead is 4 frames, not 10 (smpl_num_future_frames: 4, step1)
# Like sonic_no_vr_050k / sonic_no_vr_ll_062k it was trained WITHOUT the teleop/VR
# encoder branch, so there are only two encoder modes (g1, smpl) and no vr_3point_*
# observations.
#
# Uses "encoder_mode" (dim 3: 1 index + 2 zero-pad, modes 0-2), NOT "encoder_mode_4",
# matching the 2-mode structure -- using encoder_mode_4 would make the encoder input
# 980 and fail against the exported 979.
#
# Dimension accounting, verified against the exported ONNX (in = [1, 979]):
#   encoder_mode                                  3
#   motion_joint_positions_10frame_step1        290  \
#   motion_joint_velocities_10frame_step1       290   >  == command_multi_future_nonflat (10 x 58)
#   motion_anchor_orientation_10frame_step1      60  == motion_anchor_ori_b_mf_nonflat (10 x 6)
#   smpl_joints_4frame_step1                    288  == smpl_joints_multi_future_local_nonflat (4 x 72)
#   smpl_anchor_orientation_4frame_step1         24  == smpl_root_ori_b_multi_future (4 x 6)
#   motion_joint_positions_wrists_4frame_step1   24  == joint_pos_multi_future_wrist_for_smpl (4 x 6)
#                                              ----
#                                               979
#
# NOTE: the smpl_*_4frame_step1 / *_10frame_step1 terms must exist in
# GetObservationRegistry() (src/g1/g1_deploy_onnx_ref/src/g1_deploy_onnx_ref.cpp).
# policy/sonic_no_vr_ll_062k/observation_config.yaml already relies on the exact same
# entries, so if that policy loads on your build, this one will too.

observations:

  - name: "token_state"
    enabled: true

  - name: "his_base_angular_velocity_10frame_step1"
    enabled: true

  - name: "his_body_joint_positions_10frame_step1"
    enabled: true

  - name: "his_body_joint_velocities_10frame_step1"
    enabled: true

  - name: "his_last_actions_10frame_step1"
    enabled: true

  - name: "his_gravity_dir_10frame_step1"
    enabled: true
  # pelvis height map (must be last): zero-weight inputs added by scripts/widen_decoder_for_height_map.py
  - name: "height_map_flat"
    enabled: true
  - name: "height_map_valid_flat"
    enabled: true

encoder:
  dimension: 64
  use_fp16: false
  encoder_observations:
    - name: "encoder_mode"
      enabled: true
    # g1 encoder: command_multi_future_nonflat (positions + velocities), step1
    - name: "motion_joint_positions_10frame_step1"
      enabled: true
    - name: "motion_joint_velocities_10frame_step1"
      enabled: true
    # g1 encoder: motion_anchor_ori_b_mf_nonflat (body, multi-frame), step1
    - name: "motion_anchor_orientation_10frame_step1"
      enabled: true
    # smpl encoder: 4-frame lookahead  <-- LOW-LATENCY
    - name: "smpl_joints_4frame_step1"
      enabled: true
    - name: "smpl_anchor_orientation_4frame_step1"
      enabled: true
    - name: "motion_joint_positions_wrists_4frame_step1"
      enabled: true
    # NOTE: no vr_3point_local_target / vr_3point_local_orn_target / motion_anchor_orientation
    # (single-frame) here -- this checkpoint has NO teleop encoder mode.
  encoder_modes:
    - name: "g1"
      mode_id: 0
      required_observations:
        - encoder_mode
        - motion_joint_positions_10frame_step1
        - motion_joint_velocities_10frame_step1
        - motion_anchor_orientation_10frame_step1
    - name: "smpl"
      mode_id: 2
      required_observations:
        - encoder_mode
        - smpl_joints_4frame_step1
        - smpl_anchor_orientation_4frame_step1
        - motion_joint_positions_wrists_4frame_step1
    # NOTE: no "teleop" mode -- trained without the VR/teleop encoder branch, so
    # mode_id 1 is unused here. "smpl" MUST be mode_id 2 to match
    # zmq_endpoint_interface.hpp's hardcoded SetEncodeMode(2) for protocol v2/v3
    # (SMPL-based) ZMQ streams; the C++ side never looks up mode_id by name, so a
    # mode_id of 1 silently breaks ZMQ SMPL streaming (falls back to mode 0 = g1
    # with no g1-space reference data => no movement).
