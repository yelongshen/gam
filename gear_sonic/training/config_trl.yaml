# SONIC Training Configuration (TRL-style)
# Based on official NVlabs GR00T-WholeBodyControl training setup

# Environment
num_envs: 8  # Number of parallel environments (scale up to 4096 for full training)
num_steps_per_env: 24  # Rollout length per environment
control_freq: 50  # Control frequency (Hz)
data_dir: "/home/grease/ego_dataset/work_bearlu/data/bones-studio-processed"
model_path: "/home/grease/gam/gear_sonic_deploy/g1/scene_29dof.xml"

# Model Architecture
hidden_dim: 256
latent_dim: 64
num_tokens: 2  # FSQ tokens
codebook_size: 32  # FSQ levels per dimension
init_log_std: 0.0

# PPO Hyperparameters (matching official SONIC)
learning_rate: 3.0e-4
batch_size: 192  # num_envs * num_steps_per_env (8 * 24)
mini_batch_size: 48  # Batch size per PPO update
gradient_accumulation_steps: 1
num_ppo_epochs: 5  # PPO epochs per iteration
gamma: 0.99  # Discount factor
gae_lambda: 0.95  # GAE lambda
clip_range: 0.2  # PPO clip epsilon
clip_range_vf: 0.2  # Value function clip epsilon
vf_coef: 2.0  # Value loss coefficient
max_grad_norm: 1.0  # Gradient clipping
target_kl: 0.016  # Target KL divergence (adaptive LR)

# Training
num_iterations: 500  # Number of training iterations
seed: 42

# Logging
use_wandb: false
wandb_project: "sonic-training-trl"
wandb_entity: null
experiment_name: "sonic_trl_test"
output_dir: "./outputs/sonic_trl"

# Checkpointing
save_freq: 50  # Save checkpoint every N iterations
eval_freq: 100  # Evaluate every N iterations

# Domain Randomization (from Table S4)
# These are applied in G1MuJoCoEnv
domain_randomization:
  friction: true  # U(0.3, 1.2)
  restitution: true  # U(0.0, 0.3)
  com_offset: true  # U(±0.05 m)
  joint_jitter: true  # U(±0.05 rad)
  push_perturbations: true  # Every 100 steps
  reference_noise: true  # N(0, 0.02 rad)

# Reward
reward_scale: 5000.0  # Normalize FK reward from ~[-5000, 0] to ~[-1, 0]
