# SONIC Training Configuration (TRL-style)
# Based on official NVlabs GR00T-WholeBodyControl training setup
# Reference: gear_sonic/config/algo/ppo_im_phc.yaml

# Environment
num_steps_per_env: 32    # official: num_steps_per_env: 32
data_dir: "/home/grease/ego_dataset/work_bearlu/data/bones-studio-processed"

# Model Architecture
encoder_window: 8    # Reference-motion window fed to E_r
token_dim: 64        # Latent token dimension
hidden_dim: 256      # MLP hidden size
encoder_ckpt: null   # Path to pretrained encoder checkpoint (null = train jointly)

# Action noise — matches official Actor
# Official: init_noise_std = 0.05 (after supervised pre-training)
# Use 1.0 for random init (no pre-training)
init_noise_std: 1.0  # shared input-independent std parameter

# PPO Hyperparameters — from official ppo_im_phc.yaml
learning_rate: 2.0e-5    # official: actor_learning_rate: 2e-5
mini_batch_size: 48
num_ppo_epochs: 5        # official: num_learning_epochs: 5
gamma: 0.99              # official: gamma: 0.99
gae_lambda: 0.95         # official: lam: 0.95
clip_range: 0.2          # official: clip_param: 0.2
vf_coef: 1.0             # official: value_loss_coef: 1.0
ent_coef: 0.01           # official: entropy_coef: 0.01
max_grad_norm: 1.0       # official: max_grad_norm: 1.0

# Adaptive KL learning rate — official schedule: "adaptive"
desired_kl: 0.01         # official: desired_kl: 0.01
adaptive_lr_min: 1.0e-5  # official: adaptive_lr_min: 1e-5
adaptive_lr_max: 1.0e-2  # official: adaptive_lr_max: 2e-4 (slightly relaxed)

# Training
num_iterations: 500
seed: 42

# Reward
reward_scale: 5000.0      # Normalize FK reward ~[-5000, 0] → ~[-1, 0]

# Output
output_dir: "./outputs/sonic_trl"
save_freq: 50             # Save checkpoint every N iterations

