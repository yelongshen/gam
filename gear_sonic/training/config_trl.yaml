# SONIC Training Configuration (TRL-style)
# Based on official NVlabs GR00T-WholeBodyControl training setup

# Environment
num_steps_per_env: 24  # Rollout length per env per iteration
data_dir: "/home/grease/ego_dataset/work_bearlu/data/bones-studio-processed"

# Model Architecture
encoder_window: 8    # Reference-motion window fed to E_r
token_dim: 64        # Latent token dimension
hidden_dim: 256      # MLP hidden size
encoder_ckpt: null   # Path to pretrained encoder checkpoint (null = train jointly)

# PPO Hyperparameters (matching official SONIC Table S1)
learning_rate: 3.0e-4
mini_batch_size: 48       # transitions per mini-batch update
num_ppo_epochs: 5         # PPO epochs per iteration
gamma: 0.99               # Discount factor
gae_lambda: 0.95          # GAE λ
clip_range: 0.2           # PPO clip ε
vf_coef: 2.0              # Value loss coefficient
ent_coef: 0.01            # Entropy regularization
max_grad_norm: 1.0        # Gradient clipping

# Training
num_iterations: 500
seed: 42

# Reward
reward_scale: 5000.0      # Normalize FK reward ~[-5000, 0] → ~[-1, 0]

# Output
output_dir: "./outputs/sonic_trl"
save_freq: 50             # Save checkpoint every N iterations

