# SONIC Training Configuration (TRL-style) — v4: Sticky Motions
# Based on official NVlabs GR00T-WholeBodyControl training setup
# Reference: gear_sonic/config/algo/ppo_im_phc.yaml

# ── Environment ───────────────────────────────────────────────────────────────
# 220 steps ≈ 10 complete episodes per rollout (avg ep_len ~21 steps).
# Sticky motions: all resets within a rollout reuse the SAME clip.
# Variance reduction: ~10× vs random clip per episode (v1/v2/v3).
# Mirrors official SONIC (all 4096 envs run the same reference simultaneously).
num_steps_per_env: 220
data_dir: "/home/grease/ego_dataset/work_bearlu/data/bones-studio-processed"

# Sticky motion control:
#   1  = new clip each rollout (default — clean gradient, good diversity)
#  10  = same clip for 10 rollouts, then switch (more exploitation per clip)
motion_switch_freq: 1

# ── Model Architecture ────────────────────────────────────────────────────────
encoder_window: 8
token_dim: 64
hidden_dim: 256
encoder_ckpt: null
init_noise_std: 1.0

# ── PPO Hyperparameters ───────────────────────────────────────────────────────
learning_rate: 3.0e-4
mini_batch_size: 55
num_ppo_epochs: 5
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
vf_coef: 1.0
ent_coef: 0.0          # 0 prevents std drift (confirmed by v3 ablation)
max_grad_norm: 1.0

# Adaptive KL LR (official schedule: "adaptive")
desired_kl: 0.01
adaptive_lr_min: 1.0e-5
adaptive_lr_max: 1.0e-2

# ── Training ──────────────────────────────────────────────────────────────────
num_iterations: 5000
seed: 42

# ── Reward ────────────────────────────────────────────────────────────────────
reward_scale: 5000.0

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: "./outputs/sonic_trl_v4"
save_freq: 500


